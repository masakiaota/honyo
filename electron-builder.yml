appId: com.rot1024.honyo
productName: Honyo
directories:
  output: dist
files:
  - build/**/*
  # Native MLX artifacts live outside asar, and only in macOS packages.
  - '!build/mlx/**/*'
  - node_modules/**/*
  - package.json
  - '*.html'
  - assets/setup/**/*
extraMetadata:
  main: build/main.js
  # IMPORTANT: @electron/universal limitation
  # Must use 'commonjs' instead of 'module' because @electron/universal
  # generates a CommonJS index.js file for the universal binary.
  # This file uses require() and module.exports which are incompatible with ES modules.
  # See: https://github.com/electron/universal/issues/79
  type: commonjs
asar: true
asarUnpack:
  - node_modules/@node-llama-cpp/**/*
  - node_modules/node-llama-cpp/**/*
  - build/native/**/*.node
  - node_modules/uiohook-napi/**/*
extraResources:
  - from: src/ui/icon-normal.png
    to: icons/icon-normal.png
  - from: src/ui/icon-translating.png
    to: icons/icon-translating.png

mac:
  category: public.app-category.utilities
  extendInfo:
    LSUIElement: true
  icon: assets/icons/icon.icns
  target:
    - target: dmg
    - target: zip
  forceCodeSigning: false
  hardenedRuntime: true
  # Explicitly sign the nested executable; no JIT entitlement is needed for MLX.
  binaries:
    - Contents/Resources/mlx/honyo-mlx
  extraResources:
    - from: build/mlx
      to: mlx
      filter:
        - honyo-mlx
        - '*.dylib'
        - mlx-swift_Cmlx.bundle/**/*
        - licenses/**/*

win:
  target: nsis
  icon: assets/icons/icon.ico

linux:
  icon: assets/icons
  target:
    - target: AppImage
      arch:
        - x64

npmRebuild: true
buildDependenciesFromSource: true
nodeGypRebuild: false
